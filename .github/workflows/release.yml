name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --workspace --verbose

      - name: Package extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension/* -DestinationPath FastDL-extension.zip -Force

      - name: Upload fastdl.exe
        uses: actions/upload-artifact@v4
        with:
          name: fastdl-exe
          path: target/release/fastdl.exe

      - name: Upload fastdl-launcher.exe
        uses: actions/upload-artifact@v4
        with:
          name: fastdl-launcher-exe
          path: target/release/fastdl-launcher.exe

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: fastdl-extension
          path: FastDL-extension.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/fastdl.exe
            target/release/fastdl-launcher.exe
            FastDL-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}